# forecast weights 
forecast_weights:
  auto_weight_from_grouping:
    parameters:
      use_approx_DM: True
      apply_forecast_post_ceiling_cost_SR_before_weighting: True
    groups:
      divergent:
        weight: 0.75
        momentum:
          weight: 0.40
          momentum8: 0.3
          momentum16: 0.4
          momentum32: 0.3
        breakout:
          weight: 0.333333333333
          breakout20: 0.3
          breakout80: 0.4
          breakout160: 0.3
        assettrend:
          weight: 0.20
          assettrend4: 0.3
          assettrend8: 0.4
          assettrend16: 0.3
        accel:
          weight: 0.066666666667
          accel32: 1.0
      convergent:
        weight: 0.10
        carry:
          weight: 1.0
          carry30: 1.0
      relative:
        weight: 0.15
        relmomentum40: 1.0

